<!doctype html>
<!--
  KMSR holo ticket stickers — one per order code.
  Paste codes, preview, then Print → Save as PDF (A4, scale 100%, margins none).
  Print on holographic sticker paper without white ink: every area with no ink shows the holo.
  Top half: black ink with KMSR and the side line knocked out, a red-ink star (metallic on holo).
  Stub: bare holo with the code, a QR code of the code (any phone camera reads it) and BIRU DAUN in black ink.
  Magenta line = die cut, do not print.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KMSR holo stickers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=JetBrains+Mono:wght@500;800&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root { --bg: #0d0707; --ink: #f5ede4; --muted: #a58f89; --red: #e3202a; --line: #321d1c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #1a1010; color: var(--ink); font-family: "Archivo", system-ui, sans-serif; }

  .controls { max-width: 980px; margin: 0 auto; padding: 28px 20px 8px; display: grid; grid-template-columns: 1fr 260px; gap: 20px; }
  .controls h1 { grid-column: 1 / -1; margin: 0; font-weight: 800; font-stretch: 115%; font-size: 22px; letter-spacing: .02em; }
  .controls p { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 14px; }
  textarea { width: 100%; min-height: 150px; padding: 12px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); font: 14px/1.5 ui-monospace, Consolas, monospace; resize: vertical; }
  .side { display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .side label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  button { padding: 12px 16px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font: 700 14px "Archivo", sans-serif; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  button.primary { background: var(--red); border-color: var(--red); }
  .count { color: var(--muted); font-size: 13px; }

  .sheets { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 0 60px; }
  .sheet {
    width: 210mm; height: 297mm; padding: 5.5mm 6mm;
    background: #fff; position: relative;
    display: grid; grid-template-columns: repeat(4, 45mm); grid-auto-rows: 90mm;
    column-gap: 6mm; row-gap: 8mm; align-content: start; justify-content: center;
  }
  .sheet__foot { position: absolute; left: 6mm; bottom: 2.5mm; font: 7pt ui-monospace, Consolas, monospace; color: #999; }
  .sticker { width: 45mm; height: 90mm; display: block; overflow: visible; }

  .sticker .holo { display: none; }
  .holo-on .sticker .holo { display: inline; }
  .sticker .cut { display: none; }
  .cuts-on .sticker .cut { display: inline; }

  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .controls { display: none; }
    .sheets { padding: 0; gap: 0; display: block; }
    .sheet { page-break-after: always; break-after: page; margin: 0; }
    .sticker .holo { display: none !important; }
  }
</style>
</head>
<body class="holo-on cuts-on">
  <section class="controls">
    <h1>KMSR holo ticket stickers</h1>
    <p>One sticker per order code. Paste codes below (one per line — copy them from the Sheet). Duplicates and blank lines are ignored.</p>
    <textarea id="codes" spellcheck="false" placeholder="KM-0J4J0W&#10;KM-YNTN15"></textarea>
    <div class="side">
      <label><input type="checkbox" id="holo" checked> Holo preview (screen only)</label>
      <label><input type="checkbox" id="cuts" checked> Cut line (magenta)</label>
      <span class="count" id="count"></span>
      <button class="primary" id="print">Print / save PDF</button>
      <span class="count">PDF: A4 · scale 100% · margins none</span>
    </div>
  </section>
  <main class="sheets" id="sheets"></main>

<script>
(() => {
  const W = 450, H = 900;          // sticker in 0.1 mm units (45 × 90 mm)
  const TEAR = 628, NR = 26, R = 28;
  const PER_SHEET = 12;
  const CODE_MAX = 222;            // the big code must end before the QR's quiet zone
  const STAR = "50,0 61.8,35.3 99,35.3 69,57.1 80.4,92.6 50,70.6 19.6,92.6 31,57.1 1,35.3 38.2,35.3";

  // ticket outline: rounded corners, a half-circle bite on each side at the tear line
  const SHAPE = [
    `M${R},0 H${W - R} A${R},${R} 0 0 1 ${W},${R}`,
    `V${TEAR - NR} A${NR},${NR} 0 0 0 ${W},${TEAR + NR}`,
    `V${H - R} A${R},${R} 0 0 1 ${W - R},${H} H${R} A${R},${R} 0 0 1 0,${H - R}`,
    `V${TEAR + NR} A${NR},${NR} 0 0 0 0,${TEAR - NR}`,
    `V${R} A${R},${R} 0 0 1 ${R},0 Z`,
  ].join(" ");

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  // QR code of the order code as black squares in a size × size box. QR rather than a barcode
  // because phone cameras (iPhone Camera, LINE, WhatsApp) only scan QR codes.
  function qr(code, x, y, size) {
    if (!window.qrcode) return "";
    const q = qrcode(0, "M");
    q.addData(code);
    q.make();
    const n = q.getModuleCount();
    const m = size / n;
    let d = "";
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (q.isDark(r, c)) d += `M${(x + c * m).toFixed(2)},${(y + r * m).toFixed(2)}h${m.toFixed(2)}v${m.toFixed(2)}h-${m.toFixed(2)}z`;
      }
    }
    return `<path d="${d}" shape-rendering="crispEdges"/>`;
  }

  function sticker(code, i) {
    const id = "s" + i;
    const dash = code.indexOf("-");
    const head = dash > 0 ? code.slice(0, dash + 1) : "";
    const tail = dash > 0 ? code.slice(dash + 1) : code;
    const star = `<polygon points="${STAR}" transform="translate(292 262) scale(4.3) translate(-50 -47.5)"/>`;
    // knocked out of BOTH the black and the red star → the letters are always holo
    const letters = `
      <text transform="translate(146 318) rotate(-90)" text-anchor="middle" font-family="Archivo" font-weight="900"
            font-size="178" letter-spacing="-4">KMSR</text>
      <text transform="translate(432 314) rotate(90)" text-anchor="middle" font-family="JetBrains Mono" font-weight="800"
            font-size="19" letter-spacing="5">ADMIT ONE ✦ KAOS KMSR ✦ ITB</text>
      <text x="404" y="598" text-anchor="end" font-family="Archivo" font-weight="900" font-size="104"
            letter-spacing="-2" style="font-stretch:125%">ITB</text>`;

    return `<svg class="sticker" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sticker ${esc(code)}">
      <defs>
        <clipPath id="${id}-clip"><path d="${SHAPE}"/></clipPath>
        <clipPath id="${id}-top"><rect width="${W}" height="${TEAR}"/></clipPath>
        <mask id="${id}-black" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}">
          <rect width="${W}" height="${TEAR}" fill="#fff"/>
          <g fill="#000">${star}${letters}</g>
        </mask>
        <mask id="${id}-red" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}">
          <g fill="#fff">${star}</g>
          <g fill="#000">${letters}</g>
        </mask>
        <linearGradient id="${id}-holo" x1="0" y1="0" x2="1" y2="1" class="holo-grad">
          <stop offset="0" stop-color="#ffc6ec"/><stop offset=".18" stop-color="#c9e9ff"/>
          <stop offset=".36" stop-color="#d4ffe0"/><stop offset=".54" stop-color="#fff3c4"/>
          <stop offset=".72" stop-color="#e1ccff"/><stop offset=".9" stop-color="#bff6ff"/>
          <stop offset="1" stop-color="#ffd0f0"/>
        </linearGradient>
        <linearGradient id="${id}-sheen" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <g class="holo" clip-path="url(#${id}-clip)">
        <rect width="${W}" height="${H}" fill="url(#${id}-holo)"/>
        <rect class="sheen" x="-300" y="-200" width="260" height="${H + 400}" fill="url(#${id}-sheen)" transform="rotate(18)"/>
      </g>

      <g clip-path="url(#${id}-clip)">
        <!-- top: black ink, star in red ink (metallic on holo), lettering left bare -->
        <rect width="${W}" height="${H}" fill="#0d0707" mask="url(#${id}-black)"/>
        <g clip-path="url(#${id}-top)"><rect width="${W}" height="${H}" fill="#e3202a" mask="url(#${id}-red)"/></g>

        <!-- stub: bare holo, black ink on top -->
        <g fill="#0d0707">
          <line x1="40" y1="${TEAR + 12}" x2="${W - 40}" y2="${TEAR + 12}" stroke="#0d0707" stroke-width="4" stroke-dasharray="10 9"/>
          <text x="34" y="700" font-family="JetBrains Mono" font-weight="500" font-size="18" letter-spacing="3">Nº ORDER</text>
          <text x="32" y="754" font-family="JetBrains Mono" font-weight="800" font-size="36" letter-spacing="1">${esc(head)}</text>
          <text class="code" x="30" y="814" font-family="JetBrains Mono" font-weight="800" font-size="56" letter-spacing="0">${esc(tail)}</text>
          ${qr(code, W - 30 - 136, 668, 136)}
          <text x="${W / 2}" y="878" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="19"
                letter-spacing="9" style="font-stretch:125%">BIRU DAUN</text>
        </g>
      </g>

      <path class="cut" d="${SHAPE}" fill="none" stroke="#ff00ff" stroke-width="2.5"/>
    </svg>`;
  }

  // a long code is squeezed to fit instead of running off the stub
  function fitCodes() {
    document.querySelectorAll(".sticker .code").forEach((t) => {
      t.removeAttribute("textLength");
      t.removeAttribute("lengthAdjust");
      let len = 0;
      try { len = t.getComputedTextLength(); } catch (e) {}
      if (len > CODE_MAX) {
        t.setAttribute("textLength", String(CODE_MAX));
        t.setAttribute("lengthAdjust", "spacingAndGlyphs");
      }
    });
  }

  const ta = document.getElementById("codes");
  const sheetsEl = document.getElementById("sheets");
  const countEl = document.getElementById("count");

  function codes() {
    const seen = new Set();
    return ta.value.split(/[\r\n,;\t]+/).map((s) => s.trim().toUpperCase())
      .filter((s) => s && s !== "ORDER REF" && !seen.has(s) && seen.add(s));
  }

  function render() {
    const list = codes();
    try { localStorage.setItem("kmsr-sticker-codes", ta.value); } catch (e) {}
    const total = Math.max(1, Math.ceil(list.length / PER_SHEET));
    const pages = [];
    for (let p = 0; p < total; p++) {
      const chunk = list.slice(p * PER_SHEET, (p + 1) * PER_SHEET);
      pages.push(`<div class="sheet">${chunk.map((c, i) => sticker(c, p * PER_SHEET + i)).join("")}
        <span class="sheet__foot">KMSR holo stickers · sheet ${p + 1}/${total} · ${chunk.length} pcs · 45×90 mm · magenta = cut, do not print</span></div>`);
    }
    sheetsEl.innerHTML = pages.join("");
    fitCodes();
    countEl.textContent = `${list.length} sticker${list.length === 1 ? "" : "s"} · ${Math.ceil(list.length / PER_SHEET) || 0} A4 sheet(s)`;
  }

  try { ta.value = localStorage.getItem("kmsr-sticker-codes") || ""; } catch (e) {}
  const params = new URLSearchParams(location.search);
  if (params.get("codes")) ta.value = params.get("codes").split(",").join("\n");
  if (!ta.value) ta.value = "KM-0J4J0W\nKM-YNTN15\nKM-2MYTHX";
  if (params.has("nocut")) { document.body.classList.remove("cuts-on"); document.getElementById("cuts").checked = false; }

  ta.addEventListener("input", render);
  document.getElementById("holo").addEventListener("change", (e) => document.body.classList.toggle("holo-on", e.target.checked));
  document.getElementById("cuts").addEventListener("change", (e) => document.body.classList.toggle("cuts-on", e.target.checked));
  document.getElementById("print").addEventListener("click", () => window.print());

  // holo sheen follows the pointer (screen only)
  document.addEventListener("pointermove", (e) => {
    const x = (e.clientX / innerWidth - 0.5) * 2;
    document.querySelectorAll(".sticker .sheen").forEach((r) => r.setAttribute("x", String(-300 + (x + 1) * 380)));
    document.querySelectorAll(".holo-grad").forEach((g) => g.setAttribute("gradientTransform", `rotate(${x * 25} .5 .5)`));
  });

  render();
  if (document.fonts) document.fonts.ready.then(render);
})();
</script>
</body>
</html>
