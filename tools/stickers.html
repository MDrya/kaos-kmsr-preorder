<!doctype html>
<!--
  KMSR holo stickers — one per order code. Designs: ?design=ticket|stamp|ace, or set (one of each
  per code). Paper: ?paper=a4|a3|a3plus (A3 and A3+ are landscape). ?fill=10 tops the codes up with
  made-up ones until there are 10 full sheets. Then Print → Save as PDF (scale 100%, margins none).
  Print on holographic vinyl without white ink: everything left white in the PDF shows the holo.
  The ticket's barcode is a real Code 128 of the order code (Google Lens reads it).
  Magenta line = die cut, do not print.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KMSR holo stickers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=JetBrains+Mono:wght@500;800&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
  :root { --bg: #0d0707; --ink: #f5ede4; --muted: #a58f89; --red: #e3202a; --line: #321d1c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #1a1010; color: var(--ink); font-family: "Archivo", system-ui, sans-serif; }

  .controls { max-width: 980px; margin: 0 auto; padding: 28px 20px 8px; display: grid; grid-template-columns: 1fr 260px; gap: 20px; }
  .controls h1 { grid-column: 1 / -1; margin: 0; font-weight: 800; font-stretch: 115%; font-size: 22px; letter-spacing: .02em; }
  .controls p { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 14px; }
  textarea { width: 100%; min-height: 150px; padding: 12px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); font: 14px/1.5 ui-monospace, Consolas, monospace; resize: vertical; }
  .side { display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .side label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  select { padding: 8px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); font: 14px "Archivo", sans-serif; }
  button { padding: 12px 16px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font: 700 14px "Archivo", sans-serif; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  button.primary { background: var(--red); border-color: var(--red); }
  .count { color: var(--muted); font-size: 13px; }

  .fill { display: flex; align-items: center; gap: 8px; }
  .fill input[type="number"] { width: 64px; padding: 6px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); font: 14px "Archivo", sans-serif; }

  /* sheets are drawn at real size (mm) and zoomed down to fit the screen */
  .sheets { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 0 60px; }
  .sheet { background: #fff; position: relative; flex: none; }
  .slot { position: absolute; }
  .sticker { display: block; width: 100%; height: 100%; overflow: visible; }

  .sticker .holo { display: none; }
  .holo-on .sticker .holo { display: inline; }
  .sticker .cut { display: none; }
  .cuts-on .sticker .cut { display: inline; }

  @media print {
    body { background: #fff; }
    .controls { display: none; }
    .sheets { padding: 0; gap: 0; display: block; zoom: 1 !important; }
    .sheet { page-break-after: always; break-after: page; margin: 0; }
    .sticker .holo { display: none !important; }
    /* holo vinyl: no ink = holo, so the holo parts go out white */
    .sticker .foil { fill: #fff !important; }
    .sticker .edge { display: none; }
    .sticker .foil-stroke { stroke: #fff !important; }
  }
</style>
</head>
<body class="holo-on cuts-on">
  <section class="controls">
    <h1>KMSR holo stickers</h1>
    <p>One sticker per order code. Paste codes below (one per line — copy them from the Sheet). Duplicates and blank lines are ignored.</p>
    <textarea id="codes" spellcheck="false" placeholder="KM-0J4J0W&#10;KM-YNTN15"></textarea>
    <div class="side">
      <label>Design
        <select id="design">
          <option value="set">All three, one set per code</option>
          <option value="ticket">Holo ticket (45×90 mm)</option>
          <option value="stamp">Postage stamp (45×60 mm)</option>
          <option value="ace">Ace of Stars card (50×70 mm)</option>
        </select>
      </label>
      <label>Paper
        <select id="paper">
          <option value="a3plus">A3+ landscape (48×32 cm)</option>
          <option value="a3">A3 landscape (42×29.7 cm)</option>
          <option value="a4">A4 portrait</option>
        </select>
      </label>
      <span class="fill"><label><input type="checkbox" id="fill"> Fill to</label>
        <input type="number" id="fillsheets" min="1" max="50" value="10"> sheets with made-up codes</span>
      <label><input type="checkbox" id="holo" checked> Holo preview (screen only)</label>
      <label><input type="checkbox" id="cuts" checked> Cut line (magenta)</label>
      <span class="count" id="count"></span>
      <button class="primary" id="print">Print / save PDF</button>
      <span class="count" id="pdfnote"></span>
    </div>
  </section>
  <main class="sheets" id="sheets"></main>

<script>
(() => {
  const STAR = "50,0 61.8,35.3 99,35.3 69,57.1 80.4,92.6 50,70.6 19.6,92.6 31,57.1 1,35.3 38.2,35.3";
  const INK = "#0d0707", RED = "#e3202a";
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const star = (cx, cy, s, rot = 0) =>
    `<polygon points="${STAR}" transform="translate(${cx} ${cy}) rotate(${rot}) scale(${s}) translate(-50 -47.5)"/>`;

  // Real Code 128 of the order code — unique per sticker, and Google Lens can read it.
  // Returns black rects fitted into the box (w × h). With rotate=true it runs top-to-bottom.
  function barcode(code, x, y, w, h, rotate) {
    if (!window.JsBarcode) return "";
    const tmp = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    try { JsBarcode(tmp, code, { format: "CODE128", displayValue: false, margin: 0, height: 100, width: 2 }); }
    catch (e) { return ""; }
    const total = parseFloat(tmp.getAttribute("width")) || 1;
    const len = rotate ? h : w, k = len / total;
    // the bars sit inside JsBarcode's <g>; the loose rect outside it is the white background
    return Array.from(tmp.querySelectorAll("g rect")).map((r) => {
      const a = parseFloat(r.getAttribute("x")) * k, b = parseFloat(r.getAttribute("width")) * k;
      return rotate
        ? `<rect x="${x}" y="${(y + a).toFixed(2)}" width="${w}" height="${b.toFixed(2)}"/>`
        : `<rect x="${(x + a).toFixed(2)}" y="${y}" width="${b.toFixed(2)}" height="${h}"/>`;
    }).join("");
  }

  function holoDefs(id) {
    return `
      <linearGradient id="${id}-holo" x1="0" y1="0" x2="1" y2="1" class="holo-grad">
        <stop offset="0" stop-color="#ffc6ec"/><stop offset=".18" stop-color="#c9e9ff"/>
        <stop offset=".36" stop-color="#d4ffe0"/><stop offset=".54" stop-color="#fff3c4"/>
        <stop offset=".72" stop-color="#e1ccff"/><stop offset=".9" stop-color="#bff6ff"/>
        <stop offset="1" stop-color="#ffd0f0"/>
      </linearGradient>
      <linearGradient id="${id}-sheen" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>`;
  }
  const holoLayer = (id, W, H) => `
      <g class="holo" clip-path="url(#${id}-clip)">
        <rect width="${W}" height="${H}" fill="url(#${id}-holo)"/>
        <rect class="sheen" x="${-W * 0.7}" y="${-H * 0.3}" width="${W * 0.55}" height="${H * 1.6}" fill="url(#${id}-sheen)" transform="rotate(18)" data-w="${W}"/>
      </g>`;

  // ticket outline with a half-circle bite on both edges at the tear line
  function ticketShape(W, H, R, tear, NR, horizontal) {
    if (!horizontal) {
      return `M${R},0 H${W - R} A${R},${R} 0 0 1 ${W},${R} V${tear - NR} A${NR},${NR} 0 0 0 ${W},${tear + NR}
        V${H - R} A${R},${R} 0 0 1 ${W - R},${H} H${R} A${R},${R} 0 0 1 0,${H - R}
        V${tear + NR} A${NR},${NR} 0 0 0 0,${tear - NR} V${R} A${R},${R} 0 0 1 ${R},0 Z`;
    }
    return `M${R},0 H${tear - NR} A${NR},${NR} 0 0 0 ${tear + NR},0 H${W - R} A${R},${R} 0 0 1 ${W},${R}
      V${H - R} A${R},${R} 0 0 1 ${W - R},${H} H${tear + NR} A${NR},${NR} 0 0 0 ${tear - NR},${H}
      H${R} A${R},${R} 0 0 1 0,${H - R} V${R} A${R},${R} 0 0 1 ${R},0 Z`;
  }

  /* ---------- holo ticket (45 × 90 mm) ---------- */
  function verticalTicket(code, id) {
    const W = 450, H = 900, TEAR = 628;
    const SHAPE = ticketShape(W, H, 28, TEAR, 26, false);
    const st = star(292, 262, 4.3);
    // lettering is knocked out of both the black and the red star, so it is always holo
    const letters = `
      <text transform="translate(146 318) rotate(-90)" text-anchor="middle" font-family="Archivo" font-weight="900"
            font-size="178" letter-spacing="-4">KMSR</text>
      <text x="404" y="598" text-anchor="end" font-family="Archivo" font-weight="900" font-size="104"
            letter-spacing="-2" style="font-stretch:125%">ITB</text>`;
    return `<svg class="sticker" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="${id}-clip"><path d="${SHAPE}"/></clipPath>
        <clipPath id="${id}-top"><rect width="${W}" height="${TEAR}"/></clipPath>
        <mask id="${id}-black" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}">
          <rect width="${W}" height="${TEAR}" fill="#fff"/><g fill="#000">${st}${letters}</g>
        </mask>
        <mask id="${id}-red" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}">
          <g fill="#fff">${st}</g><g fill="#000">${letters}</g>
        </mask>
        ${holoDefs(id)}
      </defs>
      ${holoLayer(id, W, H)}
      <g clip-path="url(#${id}-clip)">
        <rect width="${W}" height="${H}" fill="${INK}" mask="url(#${id}-black)"/>
        <g clip-path="url(#${id}-top)"><rect width="${W}" height="${H}" fill="${RED}" mask="url(#${id}-red)"/></g>
        <g fill="${INK}">
          <line x1="40" y1="${TEAR + 12}" x2="${W - 40}" y2="${TEAR + 12}" stroke="${INK}" stroke-width="4" stroke-dasharray="10 9"/>
          <text x="34" y="706" font-family="JetBrains Mono" font-weight="500" font-size="20" letter-spacing="3">Nº</text>
          <text x="${W - 34}" y="706" text-anchor="end" font-family="JetBrains Mono" font-weight="500" font-size="20" letter-spacing="3">ORDER CODE</text>
          <text class="code" data-max="${W - 70}" x="${W / 2}" y="768" text-anchor="middle" font-family="JetBrains Mono" font-weight="800"
                font-size="62" letter-spacing="1">${esc(code)}</text>
          ${barcode(code, 40, 790, W - 80, 64)}
          <text x="${W / 2}" y="882" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="19"
                letter-spacing="9" style="font-stretch:125%">BIRU DAUN</text>
        </g>
      </g>
      <path class="cut" d="${SHAPE}" fill="none" stroke="#ff00ff" stroke-width="2.5"/>
    </svg>`;
  }

  /* Stamp and Ace: black, red and cream ink on holo vinyl. Elements with class "foil" are the
     holo parts: they shimmer on screen and go out white (no ink) in the PDF. */
  const CREAM = "#f5ede4";
  const foilDefs = (id) => holoDefs(id);
  const foil = (id) => `class="foil" fill="url(#${id}-holo)"`;
  const roundRect = (W, H, R) =>
    `M${R},0 H${W - R} A${R},${R} 0 0 1 ${W},${R} V${H - R} A${R},${R} 0 0 1 ${W - R},${H} H${R} A${R},${R} 0 0 1 0,${H - R} V${R} A${R},${R} 0 0 1 ${R},0 Z`;

  /* ---------- postage stamp (45 × 60 mm) ----------
     Holo scalloped stamp edge, red panel, KMSR across the top, a holo star in the
     middle, and the order code set as the stamp's value. */
  function stampPath(W, H, r, step) {
    const along = (len) => {
      const n = Math.floor((len - step) / step);
      const start = (len - n * step) / 2;
      return Array.from({ length: n + 1 }, (_, i) => start + i * step);
    };
    const xs = along(W), ys = along(H);
    let d = "M0,0 ";
    xs.forEach((cx) => { d += `L${cx - r},0 A${r},${r} 0 0 0 ${cx + r},0 `; });
    d += `L${W},0 `;
    ys.forEach((cy) => { d += `L${W},${cy - r} A${r},${r} 0 0 0 ${W},${cy + r} `; });
    d += `L${W},${H} `;
    [...xs].reverse().forEach((cx) => { d += `L${cx + r},${H} A${r},${r} 0 0 0 ${cx - r},${H} `; });
    d += `L0,${H} `;
    [...ys].reverse().forEach((cy) => { d += `L0,${cy + r} A${r},${r} 0 0 0 0,${cy - r} `; });
    return d + "Z";
  }

  function postageStamp(code, id) {
    const W = 450, H = 600;
    const SHAPE = stampPath(W, H, 13, 38);
    return `<svg class="sticker" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>${foilDefs(id)}</defs>
      <path ${foil(id)} d="${SHAPE}"/>
      <path class="edge" d="${SHAPE}" fill="none" stroke="#d9d0cc" stroke-width="2"/>
      <rect x="30" y="30" width="${W - 60}" height="${H - 60}" fill="${RED}"/>
      <rect x="44" y="44" width="${W - 88}" height="${H - 88}" fill="none" stroke="${CREAM}" stroke-width="3"/>
      <text x="${W / 2}" y="128" text-anchor="middle" font-family="Archivo" font-weight="900" font-size="76"
            letter-spacing="-1" fill="${INK}" style="font-stretch:125%">KMSR</text>
      <text x="${W / 2}" y="166" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="20"
            letter-spacing="12" fill="${INK}" style="font-stretch:125%">ITB</text>
      <g ${foil(id)}>${star(W / 2, 318, 2.35, -8)}</g>
      <text class="code" data-max="330" x="${W / 2}" y="486" text-anchor="middle" font-family="JetBrains Mono" font-weight="800"
            font-size="44" letter-spacing="1" fill="${INK}">${esc(code)}</text>
      <text x="${W / 2}" y="528" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="17"
            letter-spacing="8" fill="${INK}" style="font-stretch:125%">BIRU DAUN</text>
      <path class="cut" d="${SHAPE}" fill="none" stroke="#ff00ff" stroke-width="2.5"/>
    </svg>`;
  }

  /* ---------- Ace of Stars (50 × 70 mm) ----------
     A small KMSR / ITB on top, the red star in the middle, a small code + BIRU DAUN at the foot. The "A"
     indices and the thin frame are the only holo. */
  function aceCard(code, id) {
    const W = 500, H = 700;
    const SHAPE = roundRect(W, H, 30);
    const index = `<text x="74" y="96" text-anchor="middle" font-family="Archivo" font-weight="900" font-size="76"
                         style="font-stretch:110%">A</text>`;
    return `<svg class="sticker" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>${foilDefs(id)}</defs>
      <path d="${SHAPE}" fill="${INK}"/>
      <rect x="18" y="18" width="${W - 36}" height="${H - 36}" rx="20" fill="none" stroke="url(#${id}-holo)" stroke-width="4" class="foil-stroke"/>
      <g ${foil(id)}>${index}<g transform="rotate(180 250 350)">${index}</g></g>
      <g fill="${RED}">${star(74, 126, 0.4)}<g transform="rotate(180 250 350)">${star(74, 126, 0.4)}</g></g>
      <text x="${W / 2}" y="62" text-anchor="middle" font-family="Archivo" font-weight="900" font-size="22"
            letter-spacing="1" fill="${CREAM}" style="font-stretch:125%">KMSR</text>
      <text x="${W / 2}" y="84" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="9"
            letter-spacing="4.5" fill="${CREAM}" style="font-stretch:125%">ITB</text>
      <g fill="${RED}">${star(W / 2, 350, 2.1)}</g>
      <text class="code" data-max="190" x="${W / 2}" y="631" text-anchor="middle" font-family="JetBrains Mono" font-weight="800"
            font-size="21" letter-spacing=".5" fill="${CREAM}">${esc(code)}</text>
      <text x="${W / 2}" y="654" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="9"
            letter-spacing="4.5" fill="${CREAM}" style="font-stretch:125%">BIRU DAUN</text>
      <path class="cut" d="${SHAPE}" fill="none" stroke="#ff00ff" stroke-width="2.5"/>
    </svg>`;
  }

  // w × h in mm
  const DESIGNS = {
    ticket: { w: 45, h: 90, make: verticalTicket },
    stamp: { w: 45, h: 60, make: postageStamp },
    ace: { w: 50, h: 70, make: aceCard },
  };
  const TYPES = ["ticket", "stamp", "ace"];

  // A3/A3+ get a 10 mm margin (room for the cutter's registration marks) and 3 mm gaps.
  const PAPERS = {
    a4: { w: 210, h: 297, name: "A4", margin: 6, gap: 3 },
    a3: { w: 420, h: 297, name: "A3", margin: 10, gap: 3 },
    a3plus: { w: 480, h: 320, name: "A3+", margin: 10, gap: 3 },
  };

  // A4 single designs keep their hand-tuned grids: cols, rows, column gap, row gap, top.
  const A4_GRIDS = {
    ticket: [4, 3, 6, 8, 5.5],
    stamp: [4, 4, 6, 9, 12],
    ace: [3, 4, 8, 4, 2.5],
  };

  // Slots for one design in a grid, centred across the sheet.
  function gridSlots(paper, type, cols, rows, colGap, rowGap, top) {
    const { w, h } = DESIGNS[type];
    const x0 = (paper.w - (cols * w + (cols - 1) * colGap)) / 2;
    const y0 = top != null ? top : (paper.h - (rows * h + (rows - 1) * rowGap)) / 2;
    const slots = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      slots.push({ type, x: x0 + c * (w + colGap), y: y0 + r * (h + rowGap) });
    }
    return slots;
  }

  function fitCount(len, size, gap) { return Math.max(0, Math.floor((len + gap) / (size + gap))); }

  // Sets: fill the sheet with columns, each a stack of tickets, stamps and Aces, and pick the
  // combination of columns with the most complete sets (one of each design).
  function packSets(paper) {
    const W = paper.w - 2 * paper.margin, H = paper.h - 2 * paper.margin, g = paper.gap;
    const stacks = [];
    for (let t = 0; t <= 5; t++) for (let s = 0; s <= 6; s++) for (let a = 0; a <= 5; a++) {
      const n = t + s + a;
      const height = t * 90 + s * 60 + a * 70 + (n - 1) * g;
      if (!n || height > H || height + g + 60 <= H) continue; // too tall, or a stamp still fits under it
      stacks.push({ t, s, a, w: a ? 50 : 45, height });
    }
    let best = null;
    const pick = [];
    (function walk(from, width, t, s, a) {
      const sets = Math.min(t, s, a);
      if (sets && (!best || sets > best.sets || (sets === best.sets && pick.length < best.cols.length))) {
        best = { sets, cols: pick.slice() };
      }
      for (let i = from; i < stacks.length; i++) {
        const st = stacks[i];
        const nw = width + (pick.length ? g : 0) + st.w;
        if (nw > W) continue;
        pick.push(st);
        walk(i, nw, t + st.t, s + st.s, a + st.a);
        pick.pop();
      }
    })(0, 0, 0, 0, 0);
    if (!best) return { slots: [], sets: 0 };

    // tidy: ticket-heavy columns first; inside a column, tickets on top, then Aces, then stamps
    const cols = best.cols.slice().sort((p, q) => q.t - p.t || q.a - p.a);
    const blockW = cols.reduce((sum, c) => sum + c.w, 0) + (cols.length - 1) * g;
    const blockH = Math.max(...cols.map((c) => c.height));
    let x = (paper.w - blockW) / 2;
    const y0 = (paper.h - blockH) / 2;
    const slots = [];
    cols.forEach((c) => {
      let y = y0;
      [["ticket", c.t], ["ace", c.a], ["stamp", c.s]].forEach(([type, n]) => {
        for (let i = 0; i < n; i++) {
          // a 45 mm design in a 50 mm (Ace) column sits in the middle
          slots.push({ type, x: x + (c.w - DESIGNS[type].w) / 2, y });
          y += DESIGNS[type].h + g;
        }
      });
      x += c.w + g;
    });
    // keep exactly `sets` of each design; spare slots stay empty
    const kept = [];
    TYPES.forEach((type) => kept.push(...slots.filter((sl) => sl.type === type).slice(0, best.sets)));
    return { slots: kept, sets: best.sets };
  }

  // { slots, perSheet }: perSheet is how many codes one sheet takes.
  const layoutCache = {};
  function layout(paperKey, design) {
    const key = paperKey + "/" + design;
    if (layoutCache[key]) return layoutCache[key];
    const paper = PAPERS[paperKey];
    let out;
    if (design === "set") {
      const p = packSets(paper);
      out = { slots: p.slots, perSheet: p.sets };
    } else if (paperKey === "a4") {
      const [cols, rows, cg, rg, top] = A4_GRIDS[design];
      out = { slots: gridSlots(paper, design, cols, rows, cg, rg, top) };
    } else {
      const { w, h } = DESIGNS[design];
      const cols = fitCount(paper.w - 2 * paper.margin, w, paper.gap);
      const rows = fitCount(paper.h - 2 * paper.margin, h, paper.gap);
      out = { slots: gridSlots(paper, design, cols, rows, paper.gap, paper.gap) };
    }
    if (!out.perSheet) out.perSheet = out.slots.length;
    return (layoutCache[key] = out);
  }

  // Made-up codes in the site's format (KM- + 6 base-36), from a fixed seed so they stay put.
  function madeUpCodes(count, taken) {
    let seed = 20261101;
    const rnd = () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const ABC = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const out = [];
    while (out.length < count) {
      let c = "KM-";
      for (let i = 0; i < 6; i++) c += ABC[Math.floor(rnd() * 36)];
      if (!taken.has(c)) { taken.add(c); out.push(c); }
    }
    return out;
  }

  // a long code is squeezed to fit instead of running off the sticker
  function fitCodes() {
    document.querySelectorAll(".sticker .code").forEach((t) => {
      const max = Number(t.dataset.max) || 380;
      t.removeAttribute("textLength");
      t.removeAttribute("lengthAdjust");
      let len = 0;
      try { len = t.getComputedTextLength(); } catch (e) {}
      if (len > max) { t.setAttribute("textLength", String(max)); t.setAttribute("lengthAdjust", "spacingAndGlyphs"); }
    });
  }

  const ta = document.getElementById("codes");
  const sel = document.getElementById("design");
  const paperSel = document.getElementById("paper");
  const fillBox = document.getElementById("fill");
  const fillNum = document.getElementById("fillsheets");
  const sheetsEl = document.getElementById("sheets");
  const countEl = document.getElementById("count");
  const pageStyle = document.head.appendChild(document.createElement("style"));

  function codes() {
    const seen = new Set();
    return ta.value.split(/[\r\n,;\t]+/).map((s) => s.trim().toUpperCase())
      .filter((s) => s && s !== "ORDER REF" && !seen.has(s) && seen.add(s));
  }

  function render() {
    const paper = PAPERS[paperSel.value];
    const L = layout(paperSel.value, sel.value);
    const fillSheets = Math.max(1, Math.min(50, Number(fillNum.value) || 10));
    try {
      localStorage.setItem("kmsr-sticker-codes", ta.value);
      localStorage.setItem("kmsr-sticker-design", sel.value);
      localStorage.setItem("kmsr-sticker-paper", paperSel.value);
      localStorage.setItem("kmsr-sticker-fill", fillBox.checked ? String(fillSheets) : "");
    } catch (e) {}

    const real = codes();
    let list = real;
    if (fillBox.checked) {
      const want = fillSheets * L.perSheet;
      if (want > real.length) list = real.concat(madeUpCodes(want - real.length, new Set(real)));
    }

    pageStyle.textContent = `@page { size: ${paper.w}mm ${paper.h}mm; margin: 0; }`;
    const total = Math.max(1, Math.ceil(list.length / L.perSheet));
    const pages = [];
    for (let p = 0; p < total; p++) {
      const chunk = list.slice(p * L.perSheet, (p + 1) * L.perSheet);
      // single design: code i → slot i; set: code i → the i-th slot of each design
      const seen = {};
      const html = L.slots.map((sl) => {
        const i = sel.value === "set" ? (seen[sl.type] = (seen[sl.type] || 0) + 1) - 1 : (seen.n = (seen.n || 0) + 1) - 1;
        const code = chunk[i];
        if (!code) return "";
        const d = DESIGNS[sl.type];
        return `<div class="slot" style="left:${sl.x}mm;top:${sl.y}mm;width:${d.w}mm;height:${d.h}mm">${d.make(code, `s${p}-${sl.type}-${i}`)}</div>`;
      }).join("");
      pages.push(`<div class="sheet" style="width:${paper.w}mm;height:${paper.h}mm">${html}</div>`);
    }
    sheetsEl.innerHTML = pages.join("");
    sheetsEl.style.zoom = String(Math.min(1, (innerWidth - 40) / (paper.w * 96 / 25.4)));
    fitCodes();

    const per = sel.value === "set" ? `${L.perSheet} sets (${L.slots.length} stickers)` : `${L.perSheet} stickers`;
    const made = list.length - real.length;
    countEl.textContent = `${list.length} code${list.length === 1 ? "" : "s"}` + (made > 0 ? ` (${made} made up)` : "") +
      ` · ${total} ${paper.name} sheet${total === 1 ? "" : "s"} · ${per} per sheet`;
    document.getElementById("pdfnote").textContent = `PDF: ${paper.name} · scale 100% · margins none`;
  }

  const params = new URLSearchParams(location.search);
  try {
    ta.value = localStorage.getItem("kmsr-sticker-codes") || "";
    sel.value = localStorage.getItem("kmsr-sticker-design") || "set";
    paperSel.value = localStorage.getItem("kmsr-sticker-paper") || "a3plus";
    const f = localStorage.getItem("kmsr-sticker-fill");
    if (f) { fillBox.checked = true; fillNum.value = f; }
  } catch (e) {}
  if (params.get("codes")) ta.value = params.get("codes").split(",").join("\n");
  if (params.get("design")) sel.value = params.get("design");
  if (params.get("paper")) paperSel.value = params.get("paper");
  if (params.get("fill")) { fillBox.checked = true; fillNum.value = params.get("fill"); }
  if (!sel.value) sel.value = "set";
  if (!PAPERS[paperSel.value]) paperSel.value = "a3plus";
  if (!ta.value) ta.value = "KM-0J4J0W\nKM-YNTN15\nKM-2MYTHX";
  if (params.has("nocut")) { document.body.classList.remove("cuts-on"); document.getElementById("cuts").checked = false; }

  [ta, fillNum].forEach((el) => el.addEventListener("input", render));
  [sel, paperSel, fillBox].forEach((el) => el.addEventListener("change", render));
  addEventListener("resize", render);
  document.getElementById("holo").addEventListener("change", (e) => document.body.classList.toggle("holo-on", e.target.checked));
  document.getElementById("cuts").addEventListener("change", (e) => document.body.classList.toggle("cuts-on", e.target.checked));
  document.getElementById("print").addEventListener("click", () => window.print());

  // holo sheen follows the pointer (screen only)
  document.addEventListener("pointermove", (e) => {
    const x = (e.clientX / innerWidth - 0.5) * 2;
    document.querySelectorAll(".sticker .sheen").forEach((r) => {
      const W = Number(r.dataset.w) || 450;
      r.setAttribute("x", String(-W * 0.7 + (x + 1) * W * 0.85));
    });
    document.querySelectorAll(".holo-grad").forEach((g) => g.setAttribute("gradientTransform", `rotate(${x * 25} .5 .5)`));
  });

  render();
  if (document.fonts) document.fonts.ready.then(render);
})();
</script>
</body>
</html>
