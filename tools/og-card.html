<!doctype html>
<!--
  Source for assets/og.png, the link-preview image (WhatsApp, Instagram, etc.).
  Re-render after changing prices/deadline in config.js:
    msedge --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=6000 \
           --screenshot=assets/og.png http://localhost:5173/tools/og-card.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0d0707; color: #f5ede4; }
  body { position: relative; font-family: "Archivo", sans-serif; }
  .star { position: absolute; width: 760px; height: 722px; right: -150px; top: -70px; fill: #e3202a; transform: rotate(12deg); }
  .tee { position: absolute; width: 350px; right: 44px; top: 78px; transform: rotate(-6deg); filter: drop-shadow(0 26px 30px rgba(40,0,0,.55)); }
  .wrap { position: absolute; inset: 0; padding: 48px 56px; display: flex; flex-direction: column; }
  .eyebrow { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: 18px; letter-spacing: .16em; text-transform: uppercase; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #e3202a; }
  .eyebrow span:last-child { color: #a58f89; }
  h1 { margin-top: 26px; font-weight: 900; font-stretch: 125%; font-size: 118px; line-height: .86; letter-spacing: -.035em; text-transform: uppercase; }
  h1 .or { display: block; padding-left: 150px; font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; font-stretch: 100%; text-transform: lowercase; font-size: 1.02em; line-height: .78; letter-spacing: 0; }
  .slab { align-self: flex-start; margin-top: 30px; padding: 14px 24px 12px; background: #e3202a; outline: 3px solid #0d0707; box-shadow: 10px 10px 0 #000; }
  .slab small { display: block; font-family: "JetBrains Mono", monospace; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: #0d0707; opacity: .75; }
  .slab strong { display: block; margin-top: 2px; font-size: 44px; font-weight: 900; font-stretch: 125%; letter-spacing: -.02em; text-transform: uppercase; line-height: 1.05; }
  .foot { margin-top: auto; display: flex; align-items: baseline; gap: 26px; }
  .mark { font-weight: 900; font-stretch: 125%; font-size: 30px; letter-spacing: -.01em; }
  .mark i { font-style: normal; color: #e3202a; }
  .price { font-family: "JetBrains Mono", monospace; font-size: 19px; letter-spacing: .04em; color: #d8cbc2; }
</style>
</head>
<body>
  <svg class="star" viewBox="0 0 100 95"><polygon points="50,0 61.8,35.3 99,35.3 69,57.1 80.4,92.6 50,70.6 19.6,92.6 31,57.1 1,35.3 38.2,35.3"/></svg>
  <img class="tee" src="../assets/tee-back.png" alt="">
  <div class="wrap">
    <p class="eyebrow"><span class="dot"></span><span>Pre-order open</span><span>Batch 01</span></p>
    <h1>Twelve<span class="or">or</span>nothing.</h1>
    <div class="slab"><small>Pre-order closes</small><strong data-deadline>—</strong></div>
    <div class="foot">
      <span class="mark">KMSR<i> — </i>ITB</span>
      <span class="price" data-prices></span>
    </div>
  </div>
  <script src="../config.js"></script>
  <script>
    const C = window.KMSR_CONFIG;
    const money = (n) => "Rp " + new Intl.NumberFormat("id-ID").format(n);
    const ds = Object.values(C.products).map((p) => p.deadline).filter(Boolean).map((d) => new Date(d));
    if (ds.length) {
      const d = new Date(Math.min(...ds));
      document.querySelector("[data-deadline]").textContent = new Intl.DateTimeFormat("en-GB", {
        weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false, timeZone: C.timeZone,
      }).format(d).replace(",", " ·") + " " + C.timeZoneLabel;
    }
    document.querySelector("[data-prices]").textContent =
      Object.values(C.products).map((p) => `${p.shortName} from ${money(p.price)}`).join("  ·  ");
  </script>
</body>
</html>
